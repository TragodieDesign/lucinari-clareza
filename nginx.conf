server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # React Router (SPA): rotas no cliente caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html sem cache para novas versões entrarem no ar mais rápido
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
